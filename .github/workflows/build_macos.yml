name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build RawView macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt

      - name: Generate macOS ICNS Icon
        run: |
          python create_icns.py

      - name: Build RawView.app and DMG Installer
        run: |
          python build_mac.py

      - name: Upload DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawView-macOS-DMG
          path: dist_installer/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release (If tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
